<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2>Formulários HTML</h2>
    <!--Primeiro formulário-->
    <!--Atributos do formulário-->
    <form action="register.php" method="GET">
        <div>
         <label>Nome:</label>
         <input type="text" />
        </div>
    <!--Atributo name-->
    <div>
    <!--Atributo label-->
        <label for="age">Idade:</label>
        <input type="text" name="age">
    </div>
    <!--select-->
       <label for="job">Selecione a sua profissão</label>
       <select name="job">
         <option value="programador">Programador</option>
         <option value="tester">Tester QA</option>
         <option value="devops">devOps</option>
       </select>
    <!--Atributo selected-->
    <div>
        <label for="contract">Você leu os termos do contrato?</label>
        <select name="contract">
            <option value="sim">sim</option>
            <option value="não" selected></option>
        </select>
    </div>
    <!--Múltíplas opções-->
    <div>
        <label for="items">Selecione os itens desejados</label>
        <select name="items"multiple>
            <option value="pera">pêra</option>
            <option value="uva">uva</option>
            <option value="maça">maçã</option>
            <option value="mamao">mamão</option>
        </select>
    </div>
    <!--textarea-->
    <div>
        <label for="comment">Escreva abaixo o que você achou do post</label>
        <textarea name="comment"></textarea>
    </div>
    <!--Envio de form-->
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
